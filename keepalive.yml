name: Keep Alive - Ping to prevent cold start

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch:          # também pode rodar manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl -I https://seu-app.streamlit.app   # SUBSTITUA PELA URL DO SEU APP